# droidrooter.com — static Astro SSG site on port 8094
# Reference copy of /etc/nginx/conf.d/droidrooter.conf on the GoDaddy VPS.
# Updated 2026-08-27: canonical host/path normalization. Keep in sync with server.

server {
    listen 127.0.0.1:8094;
    server_name droidrooter.com www.droidrooter.com;
    root /var/www/cloudflare-sites/droidrooter.com;
    index index.html;
    charset utf-8;
    port_in_redirect off;
    absolute_redirect off;

    # ── 301 redirects for old blog slugs → canonical Astro slugs ──────────
    # Destinations normalized to the no-trailing-slash canonical convention.
    location = /blog/recover-data-bricked-android-edl       { return 301 /blog/android-boot-loop-fix; }
    location = /blog/recover-data-bricked-android-edl/      { return 301 /blog/android-boot-loop-fix; }
    location = /blog/factory-reset-data-recovery-myth       { return 301 /blog/factory-reset-android-before-selling; }
    location = /blog/factory-reset-data-recovery-myth/      { return 301 /blog/factory-reset-android-before-selling; }
    location = /blog/recover-deleted-android-photos         { return 301 /blog/recover-deleted-photos-android; }
    location = /blog/recover-deleted-android-photos/        { return 301 /blog/recover-deleted-photos-android; }
    location = /blog/xiaomi-frp-bypass-guide                { return 301 /blog/xiaomi-redmi-root-guide-2026; }
    location = /blog/xiaomi-frp-bypass-guide/               { return 301 /blog/xiaomi-redmi-root-guide-2026; }
    location = /blog/whatsapp-chat-recovery                 { return 301 /blog/recover-deleted-photos-android; }
    location = /blog/whatsapp-chat-recovery/                { return 301 /blog/recover-deleted-photos-android; }
    location = /blog/pixel-frp-bypass-guide                 { return 301 /blog/google-pixel-root-guide-2026; }
    location = /blog/pixel-frp-bypass-guide/                { return 301 /blog/google-pixel-root-guide-2026; }
    location = /blog/samsung-frp-bypass-guide               { return 301 /blog/samsung-galaxy-root-guide-2026; }
    location = /blog/samsung-frp-bypass-guide/              { return 301 /blog/samsung-galaxy-root-guide-2026; }
    location = /blog/best-audio-mods-android                { return 301 /blog/magisk-modules-guide-2026; }
    location = /blog/best-audio-mods-android/               { return 301 /blog/magisk-modules-guide-2026; }
    location = /blog/debloat-android-safely                 { return 301 /blog/android-debloating-guide-2026; }
    location = /blog/debloat-android-safely/                { return 301 /blog/android-debloating-guide-2026; }
    location = /blog/kernel-tuning-android                  { return 301 /blog/android-custom-kernel-guide-2026; }
    location = /blog/kernel-tuning-android/                 { return 301 /blog/android-custom-kernel-guide-2026; }
    location = /blog/miui-china-to-global-rom               { return 301 /blog/xiaomi-eu-rom-vs-global-vs-china; }
    location = /blog/miui-china-to-global-rom/              { return 301 /blog/xiaomi-eu-rom-vs-global-vs-china; }
    location = /blog/safetynet-play-integrity-fix           { return 301 /blog/safetynet-play-integrity-root-guide; }
    location = /blog/safetynet-play-integrity-fix/          { return 301 /blog/safetynet-play-integrity-root-guide; }
    location = /blog/magisk-rooting-guide                   { return 301 /blog/android-rooting-guide-2026; }
    location = /blog/magisk-rooting-guide/                  { return 301 /blog/android-rooting-guide-2026; }
    location = /blog/how-to-unroot-android                  { return 301 /blog/android-rooting-risks; }
    location = /blog/how-to-unroot-android/                 { return 301 /blog/android-rooting-risks; }
    location = /blog/recover-bricked-android                { return 301 /blog/android-boot-loop-fix; }
    location = /blog/recover-bricked-android/               { return 301 /blog/android-boot-loop-fix; }
    location = /blog/install-lineageos-guide                { return 301 /blog/best-custom-roms-2026; }
    location = /blog/install-lineageos-guide/               { return 301 /blog/best-custom-roms-2026; }
    location = /blog/banking-apps-after-root                { return 301 /blog/banking-apps-rooted-android-2026-western; }
    location = /blog/banking-apps-after-root/               { return 301 /blog/banking-apps-rooted-android-2026-western; }
    location = /blog/android-performance-tweaks-that-work   { return 301 /blog/android-phone-slow-fix; }
    location = /blog/android-performance-tweaks-that-work/  { return 301 /blog/android-phone-slow-fix; }
    location = /blog/diagnose-android-random-reboots        { return 301 /blog/android-boot-loop-fix; }
    location = /blog/diagnose-android-random-reboots/       { return 301 /blog/android-boot-loop-fix; }
    location = /blog/flash-stock-firmware-guide             { return 301 /blog/twrp-recovery-installation-guide-2026; }
    location = /blog/flash-stock-firmware-guide/            { return 301 /blog/twrp-recovery-installation-guide-2026; }
    location = /blog/stop-android-overheating               { return 301 /blog/android-overheating-fix; }
    location = /blog/stop-android-overheating/              { return 301 /blog/android-overheating-fix; }
    location = /blog/fix-android-battery-drain              { return 301 /blog/android-battery-drain-fix; }
    location = /blog/fix-android-battery-drain/             { return 301 /blog/android-battery-drain-fix; }

    # ── Canonical URL normalization (added 2026-08-27) ────────────────────
    # Hub aliases. /devices is now an indexable hub; /tools remains a redirect-only stub.
    location = /devices/            { return 301 /devices; }
    location = /devices/index.html  { return 301 /devices; }
    location = /devices.html        { return 301 /devices; }
    location = /tools               { return 301 /tools/rootability-checker; }
    location = /tools/              { return 301 /tools/rootability-checker; }
    location = /tools/index.html    { return 301 /tools/rootability-checker; }
    location = /tools.html          { return 301 /tools/rootability-checker; }

    # Homepage aliases.
    location = /index               { return 301 /; }
    location = /index/              { return 301 /; }
    location = /index.html          { return 301 /; }
    location = /index.php           { return 301 /; }

    # Low-risk legacy .html aliases for core pages.
    location = /about.html          { return 301 /about; }
    location = /blog.html           { return 301 /blog; }
    location = /contact.html        { return 301 /contact; }
    location = /faq.html            { return 301 /faq; }
    location = /glossary.html       { return 301 /glossary; }
    location = /how-it-works.html   { return 301 /how-it-works; }
    location = /locations.html      { return 301 /locations; }
    location = /portfolio.html      { return 301 /portfolio; }
    location = /pricing.html        { return 301 /pricing; }
    location = /privacy.html        { return 301 /privacy; }
    location = /services.html       { return 301 /services; }
    location = /terms.html          { return 301 /terms; }

    # Generic /index.html aliases → no-slash canonical (query strings kept).
    location ~ ^(.+)/index\.html$   { return 301 $1$is_args$args; }

    # Trailing-slash normalization → no-slash canonical (query strings kept).
    # Root "/" is not matched: the pattern requires at least one path char.
    location ~ ^(.+)/$              { return 301 $1$is_args$args; }

    # High-risk blog/year URLs are intentionally absent above. They require
    # page-level GSC query-overlap evidence before any permanent redirect.
    # See docs/HIGH-RISK-CONSOLIDATION-CANDIDATES.md.

    # ── Static asset caching ───────────────────────────────────────────────
    location ~* \.(js|css|woff2?|ttf|otf|svg|ico|png|jpg|jpeg|webp|gif|avif|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Astro SSG: directory-per-page ─────────────────────────────────────
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # ── Custom 404 page ───────────────────────────────────────────────────
    error_page 404 /404.html;

    location ~ /\. {
        deny all;
    }
}
